name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# `pages: write` and `id-token: write` are what let the deploy job mint the
# short-lived token that deploy-pages exchanges for an upload.
permissions:
  contents: read
  pages: write
  id-token: write

# Pages serves one artifact at a time. Cancel an in-flight run rather than
# queueing it, so a rapid series of pushes does not deploy stale builds last.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # bun.lock is committed, so this resolves exactly what you run locally.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Vite needs to know where the site is mounted, because GitHub Pages
      # serves a project site from /<repo>/ rather than the domain root. Derive
      # it instead of relying on a repository variable nobody remembers to set:
      # an unset BASE_PATH silently builds "/" and every /assets/* URL 404s,
      # which looks exactly like a broken app. An explicit BASE_PATH still
      # wins, and a custom domain (PAGES_DOMAIN) is served from the apex.
      - name: Resolve base path
        id: base
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
        run: |
          if [ -n "$BASE_PATH" ]; then
            echo "Using BASE_PATH from repository variables: $BASE_PATH"
          elif [ -n "$PAGES_DOMAIN" ]; then
            BASE_PATH="/"
          else
            BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          fi
          echo "Building with BASE_PATH=$BASE_PATH"
          echo "value=$BASE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          BASE_PATH: ${{ steps.base.outputs.value }}
        run: bun run build

      # A wrong base produces a build that looks fine and deploys blank, so
      # assert the paths were actually rewritten before the artifact ships.
      - name: Verify base path was applied
        env:
          BASE_PATH: ${{ steps.base.outputs.value }}
        run: |
          if ! grep -q "$BASE_PATH" dist/index.html; then
            echo "::error::dist/index.html does not reference $BASE_PATH — assets would 404"
            exit 1
          fi
          grep -q "location.replace(\"$BASE_PATH\")" dist/404.html || {
            echo "::error::dist/404.html SPA fallback was not rewritten for $BASE_PATH"
            exit 1
          }

      # A custom domain at the apex needs the CNAME record committed alongside
      # the site for Pages to keep renewing the certificate. Skipped when the
      # variable is unset, which is the case before DNS is in place.
      - name: Write CNAME
        if: ${{ vars.PAGES_DOMAIN != '' }}
        run: echo "${{ vars.PAGES_DOMAIN }}" > dist/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
